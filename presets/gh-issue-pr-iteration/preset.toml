  [[phases.exits]]
  status = "changes_requested"
  when   = "The candidate's behavior or a contract check failed under independent execution, and another iteration is required — the executable failure packet has been published."

  [[phases.exits]]
  status = "contract_invalid"
  when   = "A contract check is unexecutable, missing, or contradicts target rules — the contract defect evidence has been published and the contract must be regenerated."

