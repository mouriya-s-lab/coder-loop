[[phases]]
name   = "review"
prompt = "review-entry.md"
runner = "codex"
model  = "gpt-5.6-sol"
roles  = ["common", "quality", "review"]

  [[phases.next]]
  phase = "closure"
  on    = "completed"

  [[phases.next]]
  phase  = "iteration"
  status = "changes_requested"

  [[phases.next]]
  phase  = "contract-enrichment"
  status = "contract_invalid"

  # #407 / #409 / #410 per-phase rights segment. Review is the only NORMAL phase with grants
  # beyond the branch/pr mirror (the blocked-responder / umbrella-finalizer trigger phases
  # carry their own narrow grants — see their segments below). Review legitimately:
  #   - creates queue items (expanded-incomplete-parent flow inserts child items before flipping
  #     the parent back to changes_requested — see review/actions/state-write.md);
  #   - holds a privileged-op grant: after inserting expanded children, review reorders them to
  #     the front of the queue via `coder-loop item reorder` (see review/actions/state-write.md);
  #   - writes the blocker pointer fields: `blockerRepo` / `blockerRef` (inside the `extra`
  #     carrier via `--field-json '{"extraPatch":{"blockerRepo":...,"blockerRef":...}}'`)
  #     on the `blocked` transition (review/actions/state-write.md — "Blocker metadata").
  # The former `branch`/`pr` grant moved to iteration and publish with the six-phase split:
  # review no longer executes the identity-sync transitions (`done` moved to closure,
  # `changes_requested` identity sync moved to iteration/publish).
  #
  # #410 control-plane fields (`runner` / `repoCwd` / `dependsOn` / `priority`) cannot be granted
  # via `writableFields` on any phase — the preset parser rejects them with the engine's
  # control-plane vocabulary in the error. Default-deny + no preset surface (mirrors #409
  # acceptance #1 for the privileged-op axis). The one typed escape is the `item.dependsOn`
  # privileged op (blocked-responder's segment below), which admits top-level `dependsOn`
  # writes on the credential's own item through graph validation — never via writableFields.
  [phases.rights]
  createItems    = true
  privilegedOps  = ["item.reorder"]
  writableFields = ["blockerRepo", "blockerRef"]

  [[phases.exits]]
  status = "changes_requested"
  when   = "Evidence or code failed review, or the PR protocol is incomplete, and another iteration is required."

  [[phases.exits]]
  status = "contract_invalid"
  when   = "The durable executable contract is malformed, stale, contradictory, or missing investigated facts and must be regenerated before implementation continues."

  [[phases.exits]]
  status = "blocked"
  when   = "A missing external dependency prevents this issue from advancing in the current repository."

  # #405 chain-action exit. Review is the only role with a controlled stop-chain
  # channel — agent direct `coder-loop chain stop` calls are rejected (#409);
  # selecting this exit through the typed exit-action CLI is the engine-mapped
  # equivalent (same code path operator chain stop runs, in-flight runs naturally
  # complete, `chain resume` reversible). Use only for mechanical completion or
  # review-infrastructure failure per `review/actions/stop.md`.
  [[phases.exits]]
  chainAction = "stop"
  when        = "Mechanical completion (no actionable queue item remaining) or review infrastructure is broken and continuing would corrupt state — selected via `coder-loop item exit-action --action stop`."

  [phases.variables]
  TARGET_CWD               = { source = "runtime.targetCwd", label = "Target working directory (where `loop-data runtime artifacts` lives)" }
  AGENT_CWD                = { source = "runtime.agentCwd", label = "Agent working directory (your `cwd`; may equal TARGET_CWD or point at a different repo checkout for cross-repo work)" }
  REPO                     = { source = "chain.repository", label = "GitHub repository" }
  BASE_BRANCH              = { source = "chain.baseBranch", label = "Base branch" }
  ISSUE                    = { source = "item.issue", label = "Current issue", prefix = "#", suffix = "", style = "code" }
  RUN_ID                   = { source = "runtime.runId", label = "Run ID" }
  SHARED_CONTEXT_FILE      = { source = "runtime.sharedContextPath", label = "Chain handoff/shared file" }
  STATE_FILE               = { source = "runtime.stateFile", label = "State file", style = "plain" }
  CURRENT_ISSUE_FILE       = { source = "runtime.currentIssueFile", label = "Optional per-issue handoff file" }
  ISSUE_DIR                = "runtime.issueDir"
  EVIDENCE_DIR             = { source = "runtime.evidenceDir", label = "Evidence directory" }
  EVIDENCE_ROOT_DIR        = { source = "runtime.evidenceRootDir", label = "Evidence root directory" }
  LOG_DIR                  = { source = "runtime.logDir", label = "Log directory" }
  TRACE_FILE               = { source = "runtime.traceFile", label = "Trace file" }
  LOOP_FILE                = { source = "runtime.loopFile", label = "Loop file", style = "plain" }
  PROMPT_ROOT              = "runtime.presetDir"
  PROMPT_FRAGMENT_INDEX    = "runtime.fragmentIndex"
  RUNTIME_INPUTS_DOC       = "runtime.runtimeInputsDoc"
  PHASE_EXITS_DOC          = "runtime.phaseExitsDoc"
  # #404: review is the orchestrator of the acceptance gate and the writer
  # of item transitions, so it needs the broader status vocabulary
  # (continuable + terminal) for global queue classification (Step 7). This
  # is the contract-1 / contract-5 documented exception — the issue comment
  # 4666115115 explicitly carves out review as needing more. (Post-rebase
  # on main #497: the SUMMARY-line verdict tuple binding was retired with
  # `runVerdictVocabularyDoc` after #497 removed both the SUMMARY line and
  # the engine-owned `REVIEW_SUMMARY_VERDICTS` constant the builder read.)
  STATUS_VOCABULARY_DOC    = "runtime.statusVocabularyDoc"
  REQUIRE_BROWSER_EVIDENCE = { source = "chain.requireBrowserEvidence", default = false, label = "Browser evidence required", suffix = " — when `true`, Layer 4 must contain the strongest feasible E2E evidence for the project type. For projects with UI: real browser screenshots of the running dev server or deployed page. For projects without UI (pure CLI / library / backend / config): CLI smoke run transcripts with command, exit status, and output are the Layer 4 evidence; synthetic screenshots (HTML files rendered and screenshotted) are rejected." }
  ISSUE_BRANCH             = { source = "item.branch", label = "Existing issue branch", blankBefore = true }
  ISSUE_PR                 = { source = "item.pr", label = "Existing issue PR" }
  ISSUE_STATUS             = { source = "item.status", label = "Queue status" }
  ISSUE_LAST_RUN_ID        = { source = "item.lastRunId", label = "Previous run ID" }
  RUN_ID_GENERATION        = { source = "runtime.runIdGeneration", label = "Run-ID generation", blankBefore = true }
  RESUMED_FROM_PHASE       = { source = "runtime.resumedFromPhase", label = "Resumed-from phase" }
  RESUMED_STARTED_AT       = { source = "runtime.resumedStartedAt", label = "Resumed run started at" }
  RESUMED_SESSION_ID       = "runtime.resumedSessionId"
  CHAIN_NAME               = "runtime.chainName"
  CHAIN_UMBRELLA_REPO      = { source = "chain.umbrellaRepo", default = "" }
  CHAIN_UMBRELLA_ISSUE     = { source = "chain.umbrellaIssue", default = "" }
  REPO_CWD                 = "runtime.repoCwd"

[[phases]]
name   = "closure"
prompt = "closure-entry.md"
runner = "codex"
model  = "gpt-5.6-sol"
roles  = ["common"]

  [[phases.next]]
  phase  = "iteration"
  status = "candidate_drift"

  [[phases.next]]
  phase  = "verification"
  status = "verification_drift"

  [[phases.next]]
  phase  = "publish"
  status = "publication_drift"

  [[phases.next]]
  phase  = "review"
  status = "review_drift"

  [[phases.next]]
  phase  = "contract-enrichment"
  status = "contract_invalid"

  # No [phases.rights] segment: closure performs the irreversible external
  # effects (merge/close) and moves the item only through its declared
  # terminal/drift exits — it never mutates the queue or item fields.

  [[phases.exits]]
  status = "done"
  when   = "The accepted PR is merged (or the accepted no-PR delivery is live) and the GitHub issue is confirmed closed."

  [[phases.exits]]
  status = "moot"
  when   = "The verified moot reason is published and the GitHub issue is confirmed closed without implementation."

  [[phases.exits]]
  status = "candidate_drift"
  when   = "The candidate revision no longer matches the ReviewVerdict's CandidateRef — a new iteration must produce a fresh candidate."

  [[phases.exits]]
  status = "verification_drift"
  when   = "The VerificationPacket or its live checks no longer hold for the candidate — verification must re-execute."

  [[phases.exits]]
  status = "publication_drift"
  when   = "The publication object (PR body/ready state or no-PR artifact) no longer matches what review adjudicated — publish must re-assemble."

  [[phases.exits]]
  status = "review_drift"
  when   = "The ReviewVerdict or live review state changed, or a new blocker surfaced — review must re-adjudicate."

  [[phases.exits]]
  status = "contract_invalid"
  when   = "An operator correction superseded the contract after the verdict — the contract must be regenerated before any irreversible effect."

