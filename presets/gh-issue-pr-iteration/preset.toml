[[phases]]
name   = "diff-audit"
prompt = "diff-audit-entry.md"
runner = "codex"
model  = "gpt-5.6-sol"
roles  = ["common", "quality"]

  [[phases.next]]
  phase = "verification-audit"
  on    = "completed"

  [[phases.next]]
  phase  = "iteration"
  status = "changes_requested"

  [[phases.next]]
  phase  = "contract-enrichment"
  status = "contract_invalid"

  # No [phases.rights] segment: diff-audit posts a durable DiffAuditReport
  # comment to the PR/issue thread and its declared status exits only — it
  # never mutates the queue, item fields, or the candidate.

  [[phases.exits]]
  status = "changes_requested"
  when   = "The diff has unmapped files, hygiene findings, unauthorized test changes, uncovered marker Pattern sites, or anchored code findings against the issue's stated design — the DiffAuditReport has been published."

  [[phases.exits]]
  status = "contract_invalid"
  when   = "The marker Pattern scope is unknown / duplicate / conflicting, or the deliverable route is contradicted by the diff (e.g. PR on a no-PR route) — the DiffAuditReport has been published."

