  [[phases.next]]
  phase  = "verification"
  status = "verification_drift"

  [[phases.next]]
  phase  = "iteration"
  status = "changes_requested"

  [[phases.next]]
  phase  = "contract-enrichment"
  status = "contract_invalid"

  # No [phases.rights] segment: verification-audit posts a durable
  # VerificationAuditReport comment and its declared status exits only —
  # it never mutates the queue, item fields, or the candidate.

  [[phases.exits]]
  status = "verification_drift"
  when   = "The VerificationPacket is inadequate for the current candidate — identity mismatch, coverage gap on a marker Check, artifact contradiction, internal contradiction, live CI failing on the verified SHA, or the mandatory blocked-path row missing for a blocker-removal route — the VerificationAuditReport has been published. Verification re-executes against the same candidate."

  [[phases.exits]]
  status = "changes_requested"
  when   = "The candidate itself is wrong (the packet cannot pass because the code does not work) or the deliverable route is wrong — the VerificationAuditReport has been published. A fresh iteration must produce a new candidate."

  [[phases.exits]]
  status = "contract_invalid"
  when   = "A marker Check is malformed or unexecutable as written — the VerificationAuditReport has been published and the contract must be regenerated."

