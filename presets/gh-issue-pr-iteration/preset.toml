  RESUMED_SESSION_ID       = "runtime.resumedSessionId"
  CHAIN_NAME               = "runtime.chainName"
  CHAIN_UMBRELLA_REPO      = { source = "chain.umbrellaRepo", default = "" }
  CHAIN_UMBRELLA_ISSUE     = { source = "chain.umbrellaIssue", default = "" }
  REPO_CWD                 = "runtime.repoCwd"

[[phases]]
name   = "publish"
prompt = "publish-entry.md"
runner = "codex"
model  = "gpt-5.6-sol"
roles  = ["common", "quality"]

  [[phases.next]]
  phase = "diff-audit"
  on    = "completed"

  [[phases.next]]
  phase  = "iteration"
  status = "changes_requested"

  [[phases.next]]
  phase  = "contract-enrichment"
  status = "contract_invalid"

  # #410 field-write grant: publish re-verifies the candidate identity against
  # the verified VerificationPacket and syncs the final publication identity
  # (`branch`, `pr`) onto the item record. GitHub stays authoritative.
  [phases.rights]
  writableFields = ["branch", "pr"]

  [[phases.exits]]
  status = "changes_requested"
  when   = "The candidate changed since verification, or making the deliverable ready requires code changes — the specific gap has been published to the PR/issue thread."

  [[phases.exits]]
  status = "contract_invalid"
  when   = "The contract's delivery route or requirements are invalid for the verified candidate — the contract defect evidence has been published."

