[[phases]]
name    = "blocked-responder"
prompt  = "blocked-responder-entry.md"
trigger = { afterPhase = "review", whenStatus = "blocked" }
runner  = "codex"
model   = "gpt-5.6-sol"
roles   = ["common"]

  # Rights for the cross-repo unblock wiring (see blocked-responder-entry.md):
  #   - createItems: injects the follow-up issue as a queue item into the BLOCKING repo's
  #     chain (`coder-loop item add` — the #407 gate checks the caller phase's grant in the
  #     new item's preset, so the cross-chain injection is admitted).
  #   - item.dependsOn privileged op: declares `dependsOn` (blocker item row id) on its OWN
  #     blocked item — the record the scheduler's cross-chain auto-unblock
  #     (`unblockDependencySatisfiedItems`) consumes when the blocker reaches a success
  #     terminal. `dependsOn` is otherwise control-plane (ungrantable via writableFields);
  #     this is the one typed grant escape, scoped to the credential's own item.
  [phases.rights]
  createItems   = true
  privilegedOps = ["item.dependsOn"]

  [phases.variables]
  TARGET_CWD               = { source = "runtime.targetCwd", label = "Current target repository working directory" }
  AGENT_CWD                = { source = "runtime.agentCwd", label = "Agent working directory" }
  REPO                     = { source = "chain.repository", label = "Current GitHub repository" }
  BASE_BRANCH              = "chain.baseBranch"
  ISSUE                    = { source = "item.issue", label = "Current issue", prefix = "#", suffix = "", style = "code" }
  RUN_ID                   = { source = "runtime.runId", label = "Run ID" }
  SHARED_CONTEXT_FILE      = { source = "runtime.sharedContextPath", label = "Chain handoff/shared file" }
  STATE_FILE               = { source = "runtime.stateFile", label = "State file", style = "plain" }
  CURRENT_ISSUE_FILE       = { source = "runtime.currentIssueFile", label = "Optional per-issue handoff file" }
  ISSUE_DIR                = "runtime.issueDir"
  EVIDENCE_DIR             = { source = "runtime.evidenceDir", label = "Evidence directory" }
  EVIDENCE_ROOT_DIR        = { source = "runtime.evidenceRootDir", label = "Evidence root directory" }
  LOG_DIR                  = { source = "runtime.logDir", label = "Log directory" }
  TRACE_FILE               = "runtime.traceFile"
  LOOP_FILE                = "runtime.loopFile"
  PROMPT_ROOT              = "runtime.presetDir"
  PROMPT_FRAGMENT_INDEX    = "runtime.fragmentIndex"
  RUNTIME_INPUTS_DOC       = "runtime.runtimeInputsDoc"
  PHASE_EXITS_DOC          = "runtime.phaseExitsDoc"
  # #404 (retry on #495): the trigger status word the responder reacts to.
  # blocked-responder's prose references the gating status in two places
  # (the opening "you are spawned after review marked one selected issue"
  # sentence and the Procedure step 2 precondition); both consume this
  # doc-builder rather than hand-writing the literal. Per-phase slice in
  # `renderTriggerStatusDoc` renders only `phase.trigger.whenStatus`.
  TRIGGER_STATUS_DOC       = "runtime.triggerStatusDoc"
  REQUIRE_BROWSER_EVIDENCE = { source = "chain.requireBrowserEvidence", default = false }
  ISSUE_BRANCH             = "item.branch"
  ISSUE_PR                 = "item.pr"
  ISSUE_STATUS             = "item.status"
  ISSUE_LAST_RUN_ID        = "item.lastRunId"
  RUN_ID_GENERATION        = "runtime.runIdGeneration"
  RESUMED_FROM_PHASE       = "runtime.resumedFromPhase"
  RESUMED_STARTED_AT       = "runtime.resumedStartedAt"
  RESUMED_SESSION_ID       = "runtime.resumedSessionId"
  CHAIN_NAME               = "runtime.chainName"
  CHAIN_UMBRELLA_REPO      = { source = "chain.umbrellaRepo", default = "" }
  CHAIN_UMBRELLA_ISSUE     = { source = "chain.umbrellaIssue", default = "" }
  REPO_CWD                 = "runtime.repoCwd"

[[phases]]
name    = "umbrella-finalizer"
prompt  = "umbrella-finalizer-entry.md"
trigger = { on = "chain-complete" }
runner  = "codex"
model   = "gpt-5.6-sol"
roles   = ["common"]

  # createItems: when remaining umbrella scope is clear and executable, the finalizer creates
  # follow-up issues and injects them into the current chain queue (`coder-loop item add` /
  # `batch-add`) — the chain is still active while the chain-complete trigger runs, so the
  # injection keeps it from completing with unrepresented scope.
  [phases.rights]
  createItems = true

