# coder-loop preset: gh-issue-pr-iteration
#
# This is the default preset bundled with coder-loop. It encodes the
# GitHub issue/PR loop as eight normal phases plus two post-review trigger
# phases:
#
#   contract-enrichment → iteration → verification → publish →
#   diff-audit → verification-audit → review → closure
#
# Each phase owns one trust boundary: enrichment publishes the executable
# contract, iteration produces the candidate, verification independently
# executes the contract checks, publish assembles the ready deliverable,
# diff-audit independently audits the diff against the marker, verification-
# audit independently audits the VerificationPacket, review reads the two
# durable audit reports and adjudicates, closure re-reads live state and
# performs the irreversible external effects. Phases hand off through
# durable GitHub packets (ExecutableContract marker / CandidateRef /
# VerificationPacket / DiffAuditReport / VerificationAuditReport /
# ReviewVerdict — see common/packets.md), never through local worktree,
# stdout, or subagent context (this preset forbids subagents; every phase
# does its work in the current session).
#
# Variable binding right-hand sides use the three-prefix DSL described in
# RFC #5:
#
#   item.<field>     - field of the queue item
#   chain.<field>    - field of the chain.metadata.bindings object
#   runtime.<key>    - engine-computed runtime value
#
# Fragments are the canonical fragment list. Entry prompts may only
# reference fragments declared in [[fragments]] below.

name        = "gh-issue-pr-iteration"

[item]
idField = "issue"

[item.fields]
# #419: the idField itself ("issue") is declared as a typed transparent field. After the items
# table de-GitHub-shaping, the per-issue identity value lives in `extra.issue` (the engine
# back-fills it from the wire-level `itemId` on item.add), and prompt placeholders like
# `{{ISSUE}}` resolve through this `[item.fields]` typing pipeline instead of relying on
# the retired engine-builtin fallback (`LEGACY_TRANSPARENT_ITEM_FIELDS` retired in #419).
issue = "number"
# `branch` / `pr` — historically engine-typed first-class columns on the items table — are now
# preset-declared transparent fields. They round-trip through `extra.branch` / `extra.pr`.
# They are an observability mirror for the operator; GitHub structural identity stays
# authoritative (verification/publish/review/closure rebuild identity from CandidateRef and
# live GitHub state, never from these fields).
branch = "string"
pr = "number"
lastRunId = "string"

[statuses]
# #508: `in_progress` is included in `continuable` so the scheduler can re-pick
# an item that was mid-flight when the previous daemon process died. Daemon
# recovery (`src/daemon.ts:recoverStaleSchedulerState`) only clears the
# `current_runs` orphan row and kills the stale process group; it MUST NOT
# rewrite `items.status` / `phase` / `sessionIds`. Re-scheduling the
# interrupted item is the scheduler's job, and the scheduler already skips
# any chain that still has a live `current_run` — so listing `in_progress`
# here does not cause double-spawn while a healthy daemon is running.
#
# Eight-phase vocabulary: `changes_requested` routes back to a fresh iteration
# (writable by verification, publish, diff-audit, verification-audit, review);
# `contract_invalid` routes back to a fresh contract-enrichment (writable by
# every downstream phase); the four drift statuses are closure's re-entry
# routing when live GitHub state no longer matches the packet chain at the
# moment of the irreversible effect. `verification_drift` is also written by
# verification-audit when the VerificationPacket itself is inadequate for the
# same candidate — the candidate stays, verification re-executes.
continuable = ["queued", "in_progress", "changes_requested", "contract_invalid", "candidate_drift", "verification_drift", "publication_drift", "review_drift"]
terminal    = ["blocked", "moot", "done", "exhausted"]
# success: subset of terminal that means the item succeeded. Used by the engine's
# cross-chain dependsOn unblock: a terminal item is restored to `entry` only when ALL
# of its dependsOn targets reached a success-terminal status (not exhausted/moot).
success     = ["done"]
# entry: the actionable status the engine restores a dependency-unblocked item to.
entry       = "queued"
# unblockable: terminal statuses that `queue unblock` may restore to `entry`.
unblockable = ["blocked"]
# exhausted (#402): the status the engine writes when the per-item attempts budget
# is spent without a terminal verdict from any phase. Required by the preset schema
# (D2 verdict — "未声明则禁用" silently disables the runaway-retry safety; an
# undeclared sentinel produces a status outside the preset vocabulary). Must be one
# of `terminal`. Only the engine writes it, at the graph-entry budget check before
# a fresh attempt-starting iteration; no phase declares it as an exit (the former
# review pre-emptive `exhausted` exit is retired — the budget is the engine's
# mechanical fact, and review's verdict vocabulary already covers every business
# conclusion).
exhausted   = "exhausted"
# retry (#404): the continuable status verification/publish/review write when an
# iteration needs another attempt. Declared at the preset metadata layer so the
# `retryStatusDoc` doc builder can inject the value into md fragments that need to
# reference the retry status by name — md prose no longer hand-writes the literal.
# Must be a member of `continuable`.
retry       = "changes_requested"

[[phases]]
name   = "contract-enrichment"
prompt = "contract-enrichment-entry.md"
entry  = true
runner = "codex"
model  = "gpt-5.6-sol"
roles  = ["common", "enrichment"]

  [[phases.next]]
  phase = "iteration"
  on    = "completed"

  [phases.variables]
  TARGET_CWD               = { source = "runtime.targetCwd", label = "Target working directory (where `loop-data runtime artifacts` lives)" }
  AGENT_CWD                = { source = "runtime.agentCwd", label = "Agent working directory (your `cwd`; may equal TARGET_CWD or point at a different repo checkout for cross-repo work)" }
  REPO                     = { source = "chain.repository", label = "GitHub repository" }
  BASE_BRANCH              = { source = "chain.baseBranch", label = "Base branch" }
  ISSUE                    = { source = "item.issue", label = "Current issue", prefix = "#", suffix = "", style = "code" }
  RUN_ID                   = { source = "runtime.runId", label = "Run ID" }
  SHARED_CONTEXT_FILE      = { source = "runtime.sharedContextPath", label = "Chain handoff/shared file" }
  STATE_FILE               = { source = "runtime.stateFile", label = "State file", style = "plain" }
  CURRENT_ISSUE_FILE       = { source = "runtime.currentIssueFile", label = "Optional per-issue handoff file" }
  ISSUE_DIR                = "runtime.issueDir"
  EVIDENCE_DIR             = { source = "runtime.evidenceDir", label = "Evidence directory" }
  EVIDENCE_ROOT_DIR        = { source = "runtime.evidenceRootDir", label = "Evidence root directory" }
  LOG_DIR                  = { source = "runtime.logDir", label = "Log directory" }
  TRACE_FILE               = "runtime.traceFile"
  LOOP_FILE                = "runtime.loopFile"
  PROMPT_ROOT              = "runtime.presetDir"
  PROMPT_FRAGMENT_INDEX    = "runtime.fragmentIndex"
  RUNTIME_INPUTS_DOC       = "runtime.runtimeInputsDoc"
  PHASE_EXITS_DOC          = "runtime.phaseExitsDoc"
  RETRY_STATUS_DOC         = "runtime.retryStatusDoc"
  TERMINAL_STATUSES_DOC    = "runtime.terminalStatusesDoc"
  REQUIRE_BROWSER_EVIDENCE = { source = "chain.requireBrowserEvidence", default = false, label = "Browser evidence required", suffix = " — when `true`, Layer 4 must contain the strongest feasible E2E evidence for the project type. For projects with UI: real browser screenshots of the running dev server or deployed page. For projects without UI (pure CLI / library / backend / config): CLI smoke run transcripts with command, exit status, and output are the Layer 4 evidence; do not fabricate screenshots by creating HTML files and screenshotting them." }
  ISSUE_BRANCH             = { source = "item.branch", label = "Existing issue branch", blankBefore = true }
  ISSUE_PR                 = { source = "item.pr", label = "Existing issue PR" }
  ISSUE_STATUS             = { source = "item.status", label = "Queue status" }
  ISSUE_LAST_RUN_ID        = { source = "item.lastRunId", label = "Previous run ID" }
  RUN_ID_GENERATION        = { source = "runtime.runIdGeneration", label = "Run-ID generation", blankBefore = true }
  RESUMED_FROM_PHASE       = { source = "runtime.resumedFromPhase", label = "Resumed-from phase" }
  RESUMED_STARTED_AT       = { source = "runtime.resumedStartedAt", label = "Resumed run started at" }
  RESUMED_SESSION_ID       = "runtime.resumedSessionId"
  CHAIN_NAME               = "runtime.chainName"
  CHAIN_UMBRELLA_REPO      = { source = "chain.umbrellaRepo", default = "" }
  CHAIN_UMBRELLA_ISSUE     = { source = "chain.umbrellaIssue", default = "" }
  REPO_CWD                 = "runtime.repoCwd"

[[phases]]
name   = "iteration"
prompt = "iter-entry.md"
# §4.4: the only attempt-starting phase. One attempt covers the whole successor
# chain (verification → publish → review → closure); every fresh graph-entry
# into iteration consumes one attempt, and the engine's budget gate writes
# `exhausted` only when the workflow asks for a new iteration entry.
startsAttempt = true
runner = "codex"
model  = "gpt-5.6-sol"
roles  = ["common", "quality", "iter"]

  [[phases.next]]
  phase = "verification"
  on    = "completed"

  [[phases.next]]
  phase  = "contract-enrichment"
  status = "contract_invalid"

  # Field-write grant: iteration syncs the observability mirror (`branch`,
  # `pr`) onto the item record once the candidate is durable (draft PR pushed /
  # CandidateRef written). GitHub stays authoritative for candidate identity.
  [phases.rights]
  writableFields = ["branch", "pr"]

  [[phases.exits]]
  status = "contract_invalid"
  when   = "The current executable-contract marker is missing, malformed, stale after an operator correction, or contradictory before implementation begins."

  [phases.variables]
  TARGET_CWD               = { source = "runtime.targetCwd", label = "Target working directory (where `loop-data runtime artifacts` lives)" }
  AGENT_CWD                = { source = "runtime.agentCwd", label = "Agent working directory (your `cwd`; may equal TARGET_CWD or point at a different repo checkout for cross-repo work)" }
  REPO                     = { source = "chain.repository", label = "GitHub repository" }
  BASE_BRANCH              = { source = "chain.baseBranch", label = "Base branch" }
