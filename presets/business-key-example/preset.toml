# coder-loop preset: business-key-example
#
# Minimal verification fixture for issue #448 — demonstrates that a preset can
# declare a runtime business key AND supply its value entirely within its own
# preset files, with zero engine knowledge of the key's semantics.
#
# Contract pinned by issue #448 acceptance:
#   - path:         presets/business-key-example/
#   - business key: auditDemo
#   - template var: AUDIT_DEMO (binds runtime.auditDemo)
#   - expected:    "business-key-e2e-ok" when rendered through the real spawn
#                  path (buildSchedulerResolveContext -> renderPrompt)
#
# The supply form below (`[runtime.businessKeyValues]` table) is the mechanism
# introduced by the implementation of #448 — fixture must NOT add any code in
# `src/` to make this render.

name = "business-key-example"

[item]
idField = "id"

[runtime]
businessKeys = ["auditDemo"]

  [runtime.businessKeyValues]
  auditDemo = { literal = "business-key-e2e-ok" }

[statuses]
continuable = ["pending"]
terminal    = ["done", "exhausted"]
# exhausted (#402): required preset declaration for the attempts-exhausted落点.
exhausted   = "exhausted"

[[phases]]
name   = "audit"
prompt = "audit-entry.md"

  # #408 cross-table DAG check requires every continuable status to have at
  # least one leaving phase-exit edge. The fixture's `audit` phase had no
  # exits declared (it only exists to verify `{{AUDIT_DEMO}}` rendering, not
  # to drive a state machine), which made `pending` a deadlock under R2.
  # Declaring the single terminal exit the fixture would naturally write keeps
  # the render-test path identical and makes the fixture a positive bundled
  # example for the new checker.
  [[phases.exits]]
  status = "done"
  when   = "Audit rendering complete; the business-key fixture has nothing else to do."

  [phases.variables]
  ITEM_ID    = "item.id"
  RUN_ID     = "runtime.runId"
  AUDIT_DEMO = "runtime.auditDemo"

[agent]
attemptTimeoutSeconds = 3600
