  RUNTIME_INPUTS_DOC       = "runtime.runtimeInputsDoc"
  PHASE_EXITS_DOC          = "runtime.phaseExitsDoc"
  RETRY_STATUS_DOC         = "runtime.retryStatusDoc"
  TERMINAL_STATUSES_DOC    = "runtime.terminalStatusesDoc"
  REQUIRE_BROWSER_EVIDENCE = { source = "chain.requireBrowserEvidence", default = false, label = "Browser evidence required", suffix = " — when `true`, Layer 4 must contain the strongest feasible E2E evidence for the project type. For projects with UI: real browser screenshots of the running dev server or deployed page. For projects without UI (pure CLI / library / backend / config): CLI smoke run transcripts with command, exit status, and output are the Layer 4 evidence; do not fabricate screenshots by creating HTML files and screenshotting them." }
  ISSUE_BRANCH             = { source = "item.branch", label = "Existing issue branch", blankBefore = true }
