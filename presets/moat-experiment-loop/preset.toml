  BASE_BRANCH           = { source = "chain.baseBranch", label = "Base branch" }
  ISSUE                 = { source = "item.issue", label = "Experiment issue", prefix = "#" }
  ISSUE_BRANCH          = { source = "item.branch", label = "Run branch" }
  ISSUE_PR              = { source = "item.pr", label = "Run PR" }
  ISSUE_STATUS          = { source = "item.status", label = "Queue status" }
  ISSUE_LAST_RUN_ID     = { source = "item.lastRunId", label = "Previous run ID" }
  RUN_ID                = { source = "runtime.runId", label = "Engine run ID" }
  AGENT_CWD             = { source = "runtime.agentCwd", label = "Agent worktree" }
  TARGET_CWD            = { source = "runtime.targetCwd", label = "Target checkout" }
  REPO_CWD              = "runtime.repoCwd"
  CHAIN_NAME            = "runtime.chainName"
  SHARED_CONTEXT_FILE   = "runtime.sharedContextPath"
  TRACE_FILE            = "runtime.traceFile"
  PROMPT_ROOT           = "runtime.presetDir"
  PROMPT_FRAGMENT_INDEX = "runtime.fragmentIndex"
  RUNTIME_INPUTS_DOC    = "runtime.runtimeInputsDoc"
  PHASE_EXITS_DOC       = "runtime.phaseExitsDoc"
  STATUS_VOCABULARY_DOC = "runtime.statusVocabularyDoc"
  TRIGGER_STATUS_DOC    = "runtime.triggerStatusDoc"


[[phases]]
name = "umbrella-finalizer"
prompt = "umbrella-finalizer-entry.md"
runner = "claude"
model = "claude-opus-4-7"
roles = ["common"]
trigger = { on = "chain-complete" }

  [phases.variables]
  REPO                  = { source = "chain.repository", label = "Experiment repository" }
  BASE_BRANCH           = { source = "chain.baseBranch", label = "Base branch" }
  ISSUE                 = { source = "item.issue", label = "Experiment issue", prefix = "#" }
  ISSUE_BRANCH          = { source = "item.branch", label = "Run branch" }
  ISSUE_PR              = { source = "item.pr", label = "Run PR" }
  ISSUE_STATUS          = { source = "item.status", label = "Queue status" }
  ISSUE_LAST_RUN_ID     = { source = "item.lastRunId", label = "Previous run ID" }
  RUN_ID                = { source = "runtime.runId", label = "Engine run ID" }
  AGENT_CWD             = { source = "runtime.agentCwd", label = "Agent worktree" }
  TARGET_CWD            = { source = "runtime.targetCwd", label = "Target checkout" }
  REPO_CWD              = "runtime.repoCwd"
  CHAIN_NAME            = "runtime.chainName"
  SHARED_CONTEXT_FILE   = "runtime.sharedContextPath"
  TRACE_FILE            = "runtime.traceFile"
  PROMPT_ROOT           = "runtime.presetDir"
  PROMPT_FRAGMENT_INDEX = "runtime.fragmentIndex"
  RUNTIME_INPUTS_DOC    = "runtime.runtimeInputsDoc"
  PHASE_EXITS_DOC       = "runtime.phaseExitsDoc"
  STATUS_VOCABULARY_DOC = "runtime.statusVocabularyDoc"
  TRIGGER_STATUS_DOC    = "runtime.triggerStatusDoc"

